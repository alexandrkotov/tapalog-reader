<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapalog Reader Capabilities</title>
<style>
  /* Layout: a masthead with the thesis and the facts, a map of six capability groups, then one diagram of how the single file works with its surroundings. */
  :root {
    --bg: #f2f5f4;
    --surface: #ffffff;
    --surface-2: #e9eeec;
    --fg: #13201f;
    --muted: #546664;
    --line: #d3dbd9;
    --hub: #0f766e;
    --hub-tint: #dff1ee;
    --read: #1d4ed8;
    --lib: #15803d;
    --scan: #b45309;
    --access: #be123c;
    --plug: #6d28d9;
    --tech: #3f4f4d;
    --font-display: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --font-body: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1413;
      --surface: #131f1e;
      --surface-2: #1b2b29;
      --fg: #e5eeec;
      --muted: #94a9a6;
      --line: #263634;
      --hub: #2dd4bf;
      --hub-tint: #12302d;
      --read: #8bb0ff;
      --lib: #66d392;
      --scan: #f2b252;
      --access: #ff94ab;
      --plug: #bba2ff;
      --tech: #a8bbb8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1413;
    --surface: #131f1e;
    --surface-2: #1b2b29;
    --fg: #e5eeec;
    --muted: #94a9a6;
    --line: #263634;
    --hub: #2dd4bf;
    --hub-tint: #12302d;
    --read: #8bb0ff;
    --lib: #66d392;
    --scan: #f2b252;
    --access: #ff94ab;
    --plug: #bba2ff;
    --tech: #a8bbb8;
    color-scheme: dark;
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    padding-block: 28px 56px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 44px; }
  h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }

  /* masthead */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-family: var(--font-display); font-weight: 700; font-size: 15px; letter-spacing: 0.02em; display: flex; align-items: center; gap: 10px; }
  .brand i { display: inline-block; width: 14px; height: 18px; background: var(--hub); border-radius: 1px 4px 4px 1px; box-shadow: 4px 0 0 -1px var(--surface), 5px 0 0 0 var(--hub); }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .lang button { font: 500 13px var(--font-body); color: var(--muted); background: transparent; border: 0; padding: 6px 12px; cursor: pointer; }
  .lang button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  .lang button:focus-visible { outline: 2px solid var(--hub); outline-offset: -2px; }
  .head { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 36px 48px; align-items: end; }
  .head h1 { font-size: clamp(34px, 5.4vw, 60px); line-height: 1.04; font-weight: 700; letter-spacing: -0.02em; }
  .head h1 em { font-style: normal; color: var(--hub); }
  .lead { margin: 18px 0 0; color: var(--muted); font-size: 17px; max-width: 54ch; }
  .facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0; border-top: 1px solid var(--line); }
  .fact { padding: 14px 0; border-bottom: 1px solid var(--line); }
  .fact:nth-child(odd) { padding-right: 16px; }
  .fact b { display: block; font: 700 30px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
  .fact span { color: var(--muted); font-size: 13px; }

  /* map */
  .sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .sec-title h2 { font-size: 26px; letter-spacing: -0.01em; }
  .sec-title p { margin: 0; color: var(--muted); font-size: 14px; }
  .map { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .group { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 20px 20px 8px; min-width: 0; --c: var(--hub); }
  .group[data-g="read"] { --c: var(--read); }
  .group[data-g="lib"] { --c: var(--lib); }
  .group[data-g="scan"] { --c: var(--scan); }
  .group[data-g="access"] { --c: var(--access); }
  .group[data-g="plug"] { --c: var(--plug); }
  .group[data-g="tech"] { --c: var(--tech); }
  .group h3 { font-size: 20px; color: var(--c); display: flex; align-items: center; gap: 10px; }
  .group h3::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
  .group .sub { margin: 6px 0 12px; color: var(--muted); font-size: 13.5px; }
  .group ul { list-style: none; margin: 0; padding: 0; }
  .group li { padding: 9px 0; border-top: 1px solid var(--line); min-width: 0; }
  .group li b { font-weight: 600; }
  .group li span { color: var(--muted); }

  /* how it works */
  .diagram { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px; overflow-x: auto; }
  .diagram svg { display: block; min-width: 900px; width: 100%; height: auto; }
  .diagram text { font-family: var(--font-body); fill: var(--fg); font-size: 13px; }
  .diagram .t { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
  .diagram .m { fill: var(--muted); font-size: 12.5px; }
  .diagram .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .diagram .hub { fill: var(--hub-tint); stroke: var(--hub); stroke-width: 2; }
  .diagram .tile { fill: var(--surface); stroke: var(--hub); stroke-width: 1; opacity: 0.95; }
  .diagram .adm { fill: var(--surface); stroke: var(--scan); stroke-width: 1.5; }
  .diagram .plg { fill: var(--surface); stroke: var(--plug); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .diagram .net { fill: var(--surface-2); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .diagram .arr { fill: none; stroke: var(--muted); stroke-width: 1.6; }
  .diagram .arr.dash { stroke-dasharray: 5 4; }
  .diagram marker path { fill: var(--muted); }
  .legend { margin: 14px 0 0; color: var(--muted); font-size: 13.5px; max-width: 78ch; }

  footer { border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 13px; display: flex; gap: 8px 24px; flex-wrap: wrap; }

  @media (max-width: 960px) { .map { grid-template-columns: repeat(2, minmax(0, 1fr)); } .head { grid-template-columns: 1fr; } }
  @media (max-width: 620px) { .map { grid-template-columns: 1fr; } .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
</style>

<div class="wrap">
  <div class="top">
    <div class="brand"><i></i><span>Tapalog Reader</span></div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="b-ru" aria-pressed="true">Русский</button>
      <button type="button" id="b-en" aria-pressed="false">English</button>
    </div>
  </div>

  <header class="head">
    <div>
      <h1 data-k="h1"></h1>
      <p class="lead" data-k="lead"></p>
    </div>
    <div class="facts" id="facts"></div>
  </header>

  <section>
    <div class="sec-title"><h2 data-k="mapTitle"></h2><p data-k="mapNote"></p></div>
    <div class="map" id="map"></div>
  </section>

  <section>
    <div class="sec-title"><h2 data-k="howTitle"></h2><p data-k="howNote"></p></div>
    <div class="diagram">

        </g>
        <text class="m" x="380" y="308" data-k="dg.hubFoot"></text>

        <!-- folders -->
        <rect class="box" x="810" y="40" width="250" height="110" rx="6"/>
        <text class="t" x="828" y="68" data-k="dg.books"></text>
        <text class="m" x="828" y="94" data-k="dg.b1"></text>

        <text class="m" x="828" y="134" data-k="dg.b3"></text>
        <rect class="box" x="810" y="180" width="250" height="150" rx="6"/>
        <text class="t" x="828" y="208" data-k="dg.data"></text>
        <text class="m" x="828" y="234" data-k="dg.d1"></text>
        <text class="m" x="828" y="254" data-k="dg.d2"></text>
        <text class="m" x="828" y="274" data-k="dg.d3"></text>
        <text class="m" x="828" y="294" data-k="dg.d4"></text>

        <!-- the administrator's browser -->
        <rect class="adm" x="360" y="400" width="380" height="120" rx="6"/>
        <text class="t" x="380" y="428" data-k="dg.admin"></text>
        <text class="m" x="380" y="454" data-k="dg.a1"></text>
        <text class="m" x="380" y="474" data-k="dg.a2"></text>
        <text class="m" x="380" y="494" data-k="dg.a3"></text>

        <!-- plugins -->
        <rect class="plg" x="810" y="400" width="250" height="120" rx="6"/>
        <text class="t" x="828" y="428" data-k="dg.plug"></text>

        <!-- arrows -->
        <path class="arr" d="M272 105 H358" marker-start="url(#a)" marker-end="url(#a)"/>
        <path class="arr dash" d="M145 192 V258" marker-end="url(#a)"/>
        <path class="arr dash" d="M272 295 H358" marker-end="url(#a)"/>
        <path class="arr" d="M742 95 H808" marker-start="url(#a)" marker-end="url(#a)"/>
        <path class="arr" d="M742 255 H808" marker-start="url(#a)" marker-end="url(#a)"/>
        <path class="arr" d="M550 332 V398" marker-start="url(#a)" marker-end="url(#a)"/>
        <path class="arr dash" d="M808 460 H775 V310 H742" marker-end="url(#a)"/>
        <text class="m" x="315" y="92" text-anchor="middle" data-k="dg.l1"></text>
        <text class="m" x="562" y="368" data-k="dg.l2"></text>
        <text class="m" x="156" y="228" data-k="dg.l3"></text>
      </svg>
    </div>
    <p class="legend" data-k="legend"></p>
  </section>

  <footer id="foot"></footer>
</div>

  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

  function render(lang) {
    const L = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-k]").forEach((node) => {
      const text = L[node.dataset.k];
      if (text === undefined) return;
      if (node.tagName === "H1") node.innerHTML = text;
      else node.textContent = text;
    });
    document.getElementById("facts").innerHTML = L.facts.map(([n, d]) => '<div class="fact"><b>' + esc(n) + "</b><span>" + esc(d) + "</span></div>").join("");
    document.getElementById("map").innerHTML = L.groups
      .map((g) => '<article class="group" data-g="' + g.g + '"><h3>' + esc(g.name) + '</h3><p class="sub">' + esc(g.sub) + "</p><ul>" + g.items.map(([a, b]) => "<li><b>" + esc(a) + "</b> <span>" + esc(b) + "</span></li>").join("") + "</ul></article>")
      .join("");
    document.getElementById("foot").innerHTML = L.foot.map((s) => "<span>" + esc(s) + "</span>").join("");
    document.getElementById("b-ru").setAttribute("aria-pressed", String(lang === "ru"));
    document.getElementById("b-en").setAttribute("aria-pressed", String(lang === "en"));
    try { localStorage.setItem("tr-lang", lang); } catch (e) { /* the choice is only a convenience */ }
  }

  let start = "ru";
  try { start = localStorage.getItem("tr-lang") === "en" ? "en" : "ru"; } catch (e) { /* the default stays */ }
  document.getElementById("b-ru").addEventListener("click", () => render("ru"));
  document.getElementById("b-en").addEventListener("click", () => render("en"));
  render(start);
</script>
