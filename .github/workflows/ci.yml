name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # The executable for this very system, without the embedded tunnel program: starts it and talks to it.
      - name: Build and smoke-test the executable
        shell: bash
        run: |
          bun build --compile src/server/main.ts --outfile dist/smoke-test
          bun scripts/smoke.ts "dist/smoke-test$([ "$RUNNER_OS" = Windows ] && echo .exe)"
