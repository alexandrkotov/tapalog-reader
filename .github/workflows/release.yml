name: Release

# Push a tag such as v0.2.0 to build the executables for every system and attach them to a draft GitHub release (press Publish there).
# "Run workflow" on the Actions page does the same build without publishing: the files stay as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04 }
          - { target: macos-arm64, os: ubuntu-24.04 }
          - { target: macos-x64, os: ubuntu-24.04 }
          # the Windows build runs on Windows: Bun can put the program's icon into the .exe only there
          - { target: windows-x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # compile:* downloads the matching cloudflared and embeds it
      - run: bun run compile:${{ matrix.target }}
      - name: Smoke-test the Linux build (the others cannot run on this machine)
        if: matrix.target == 'linux-x64'
        run: bun scripts/smoke.ts dist/tapalog-reader-linux-x64
      - name: Pack
        if: matrix.target != 'windows-x64'
        run: |
          mkdir -p out
          cp LICENSE dist/
          cd dist
          chmod +x tapalog-reader-${{ matrix.target }}
          tar czf ../out/tapalog-reader-${{ matrix.target }}.tar.gz tapalog-reader-${{ matrix.target }} LICENSE
      - name: Pack (Windows)
        if: matrix.target == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/tapalog-reader-windows-x64.exe, dist/LICENSE -DestinationPath out/tapalog-reader-windows-x64.zip
      - uses: actions/upload-artifact@v6
        with:
          name: tapalog-reader-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        # a draft: look at the notes and files on the Releases page, then press Publish
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --draft --notes-file .github/release-notes.md --generate-notes
