name: Release

# Push a tag such as v0.2.0 to build the executables for every system and attach them to a GitHub release.
# "Run workflow" on the Actions page does the same build without publishing: the files stay as workflow artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      # compile:* downloads the matching cloudflared and embeds it
      - run: bun run compile:${{ matrix.target }}
      - name: Smoke-test the Linux build (the others cannot run on this machine)
        if: matrix.target == 'linux-x64'
        run: bun scripts/smoke.ts dist/tapalog-reader-linux-x64
      - name: Pack
        run: |
          mkdir -p out
          cp LICENSE dist/
          cd dist
          if [ "${{ matrix.target }}" = windows-x64 ]; then
            zip ../out/tapalog-reader-${{ matrix.target }}.zip tapalog-reader-windows-x64.exe LICENSE
          else
            chmod +x tapalog-reader-${{ matrix.target }}
            tar czf ../out/tapalog-reader-${{ matrix.target }}.tar.gz tapalog-reader-${{ matrix.target }} LICENSE
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: tapalog-reader-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  publish:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
