<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Books are third-party content: an EPUB may carry <script> and inline handlers. This policy is inherited by the blob: documents the text reader renders them in, so they cannot run. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; frame-src blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>Tapalog Reader</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232459d6'/%3E%3Crect x='12' y='43' width='40' height='11' rx='2' fill='%23f2f4f8'/%3E%3Crect x='12' y='43' width='7' height='11' rx='2' fill='%23c9d3e6'/%3E%3Crect x='22' y='47' width='22' height='2.4' rx='1.2' fill='%232459d6'/%3E%3Crect x='16' y='31' width='34' height='11' rx='2' fill='%23ffc857'/%3E%3Crect x='16' y='31' width='7' height='11' rx='2' fill='%23e0a526'/%3E%3Crect x='26' y='35' width='18' height='2.4' rx='1.2' fill='%237a4d00'/%3E%3Crect x='14' y='19' width='37' height='11' rx='2' fill='%23ff7a6b'/%3E%3Crect x='14' y='19' width='7' height='11' rx='2' fill='%23d4524a'/%3E%3Crect x='24' y='23' width='20' height='2.4' rx='1.2' fill='%23fff'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="topbar">
      <button id="panel-toggle" class="icon-btn" title="Show or hide the library panel" aria-label="Library panel" aria-expanded="true">☰</button>
      <a class="brand" id="brand" href="#">Tapalog Reader</a>
      <div class="search">
        <input id="search" type="search" placeholder="Search the library…" autocomplete="off" aria-label="Search" />
        <ul id="search-results" class="search-results" hidden role="listbox"></ul>
      </div>
      <span id="scan-state" class="scan-state" hidden></span>
      <span id="cover-state" class="scan-state" hidden></span>
      <div id="account" class="account"></div>
      <select id="theme" class="lang theme-select"></select>
      <select id="lang" class="lang" aria-label="Language"></select>
      <button id="tour" class="icon-btn" type="button">?</button>
    </header>
    <div class="layout">
      <aside id="panel" class="panel" aria-label="Library"><div id="edit-bar" class="edit-bar" hidden></div><div id="tree" class="tree"></div><div class="credit"><span id="credit-text"></span> <a href="https://tapalog.com" target="_blank" rel="noopener noreferrer">Tapalog</a> · <button id="about-open" type="button" class="credit-about"></button></div></aside>
      <main id="main" class="main"></main>
    </div>
    <script type="module" src="./app.ts"></script>
  </body>
</html>
